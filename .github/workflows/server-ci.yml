name: Server CI

on:
  pull_request:
    paths: ["apps/server/**", "pnpm-lock.yaml", ".github/workflows/server-ci.yml"]
  push:
    branches: [master]
    paths: ["apps/server/**", "pnpm-lock.yaml", ".github/workflows/server-ci.yml"]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      TEST_MONGO_URL: mongodb://localhost:27017/collaborative-editor-test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @collaborative-text-editor/server...
      - run: pnpm --filter @collaborative-text-editor/server lint
      - run: pnpm --filter @collaborative-text-editor/server format:check
      - run: pnpm --filter @collaborative-text-editor/server build
      - run: pnpm --filter @collaborative-text-editor/server typecheck
      - run: pnpm --filter @collaborative-text-editor/server test
