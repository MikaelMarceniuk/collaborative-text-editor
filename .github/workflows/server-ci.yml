name: Server CI

on:
  pull_request:
    paths: ["apps/server/**", "pnpm-lock.yaml", ".github/workflows/server-ci.yml"]
  push:
    branches: [master]
    paths: ["apps/server/**", "pnpm-lock.yaml", ".github/workflows/server-ci.yml"]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @collaborative-text-editor/server...
      - run: pnpm --filter @collaborative-text-editor/server lint
      - run: pnpm --filter @collaborative-text-editor/server format:check
      - run: pnpm --filter @collaborative-text-editor/server build
