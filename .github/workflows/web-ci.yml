name: Web CI

on:
  pull_request:
    paths: ["apps/web/**", "pnpm-lock.yaml", ".github/workflows/web-*.yml"]
  push:
    branches: [master]
    paths: ["apps/web/**", "pnpm-lock.yaml", ".github/workflows/web-*.yml"]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @collaborative-text-editor/web...
      - run: pnpm --filter @collaborative-text-editor/web lint
      - run: pnpm --filter @collaborative-text-editor/web format:check
      - run: pnpm --filter @collaborative-text-editor/web build
