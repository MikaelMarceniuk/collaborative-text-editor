name: E2E

on:
  pull_request:
    paths: ["apps/**", "pnpm-lock.yaml", "compose-dev.yml", ".github/workflows/e2e.yml"]
  push:
    branches: [master]
    paths: ["apps/**", "pnpm-lock.yaml", "compose-dev.yml", ".github/workflows/e2e.yml"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Not `services:`: the sign-up of better-auth needs Mongo as a replica set, and the compose file already
      # starts it like that (its healthcheck runs the rs.initiate). --wait returns when both are healthy
      - run: docker compose -f compose-dev.yml --profile redis up -d --wait

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The system libraries are not part of the cache, so this always runs (it is quick when the browser is cached)
      - run: pnpm --filter @collaborative-text-editor/e2e exec playwright install --with-deps chromium

      - run: pnpm --filter @collaborative-text-editor/e2e lint
      - run: pnpm --filter @collaborative-text-editor/e2e format:check
      - run: pnpm --filter @collaborative-text-editor/e2e typecheck
      - run: pnpm --filter @collaborative-text-editor/e2e test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
