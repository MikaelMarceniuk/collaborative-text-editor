app = 'collaborative-text-editor-server'
primary_region = 'iad'

[build]
dockerfile = 'Dockerfile'

[env]
NODE_OPTIONS = '--max-old-space-size=384'

[http_service]
internal_port = 3333
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
method = 'GET'
path = '/health'
interval = '30s'
timeout = '5s'
grace_period = '10s'

[[vm]]
size = 'shared-cpu-1x'
memory = '512mb'
